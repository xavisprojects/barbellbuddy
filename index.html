            align-items: flex-start;
            flex-wrap: wrap;

            margin-bottom: 8px;

            margin: 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .app-tag {
            background-color: var(--primary);
            color: #000000;
            padding: 4px 10px;
            font-size: 0.78rem;
            font-weight: 800;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .lang-select {
            background-color: #121212;
            color: var(--text);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }
        .date {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        h2 {
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-top: 30px;
            font-size: 1.25rem;
        }
        p, li {
            color: var(--text);
            font-size: 1rem;
        }
        ul {
            padding-inline-start: 22px;
        }
        li {
            margin-bottom: 8px;
        }
        .highlight-box {
            background: rgba(212, 175, 55, 0.1);
            border-inline-start: 4px solid var(--primary);
            padding: 16px;
            margin: 20px 0;
            border-radius: 6px;
        }
        code {
            background: #111111;
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--primary);
            font-size: 0.92em;
        }
        a {
            color: var(--primary);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
            flex-wrap: wrap;
        }
        .nav-tab {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border);
            background: #121212;
            color: var(--text-secondary);
            text-decoration: none;
        }
        .nav-tab.active {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }
        .nav-tab:hover {
            text-decoration: none;
            border-color: var(--primary);
            color: #FFFFFF;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        @media (max-width: 600px) {
            .container {

        function resolveInitialLang() {
            const params = new URLSearchParams(window.location.search);
            const queryLang = (params.get("lang") || "").toLowerCase().split("-")[0];
            if (queryLang === "in") return "id";
            if (i18n[queryLang]) return queryLang;

            const browserLangs = navigator.languages || [navigator.language || "en"];
            for (const raw of browserLangs) {
                const code = (raw || "").toLowerCase().split("-")[0];
                const normalized = code === "in" ? "id" : code;
                if (i18n[normalized]) return normalized;
            }
            return "en";
        }

        const termsLabels = {
            en: "Terms of Service",
            es: "Términos del Servicio",
            de: "Nutzungsbedingungen",
            fr: "Conditions d'utilisation",
            it: "Termini di Servizio",
            pt: "Termos de Serviço",
            nl: "Servicevoorwaarden",
            pl: "Warunki korzystania",
            ru: "Условия использования",
            uk: "Умови використання",
            tr: "Hizmet Şartları",
            ar: "شروط الخدمة",
            hi: "सेवा की शर्तें",
            bn: "পরিষেবার শর্তাবলী",
            id: "Ketentuan Layanan",
            vi: "Điều khoản Dịch vụ",
            th: "ข้อกำหนดในการให้บริการ",
            ja: "利用規約",
            ko: "서비스 이용약관",
            zh: "服务条款"
        };

        function renderLang(lang) {
            const data = i18n[lang] || i18n.en;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
            document.title = `Barbell Buddy - ${data.badge}`;

            const navPrivacy = document.getElementById("nav-privacy");
            const navTerms = document.getElementById("nav-terms");
            if (navPrivacy) {
                navPrivacy.textContent = data.badge;
                navPrivacy.href = `index.html?lang=${lang}`;
            }
            if (navTerms) {
                navTerms.textContent = termsLabels[lang] || termsLabels.en;
                navTerms.href = `terms.html?lang=${lang}`;
            }

            document.getElementById("t-badge").textContent = data.badge;
            document.getElementById("t-date").textContent = data.date;
            document.getElementById("t-intro").innerHTML = data.intro;
            document.getElementById("t-summary").innerHTML = data.summary;

            document.getElementById("t-h1").textContent = data.h1;
            document.getElementById("t-list1").innerHTML = data.list1.map(item => `<li>${item}</li>`).join("");

            document.getElementById("t-h2").textContent = data.h2;
            document.getElementById("t-list2").innerHTML = data.list2.map(item => `<li>${item}</li>`).join("");

            document.getElementById("t-h3").textContent = data.h3;
            document.getElementById("t-p3").textContent = data.p3;

            document.getElementById("t-h4").textContent = data.h4;
            document.getElementById("t-list4").innerHTML = data.list4.map(item => `<li>${item}</li>`).join("");

            document.getElementById("t-h5").textContent = data.h5;
            document.getElementById("t-p5").innerHTML = data.p5;

            document.getElementById("t-h6").textContent = data.h6;
            document.getElementById("lang-switcher").value = lang;
        }

        const switcher = document.getElementById("lang-switcher");
        switcher.addEventListener("change", (e) => {
            const newLang = e.target.value;
            renderLang(newLang);
            const url = new URL(window.location);
            url.searchParams.set("lang", newLang);
            window.history.replaceState({}, "", url);
        });

        renderLang(resolveInitialLang());
    </script>
