<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbell Buddy - Routine Preview</title>
    <style>
        :root {
            --primary: #D4AF37;
            --primary-variant: #A6882B;
            --bg: #000000;
            --surface: #1E1E1E;
            --surface-card: #262626;
            --text: #ECECEC;
            --text-secondary: #A0A0A0;
            --border: #333333;
            --warmup: #FFB74D;
            --dropset: #BA68C8;
            --failure: #E57373;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 840px;
            margin: 0 auto;
            background: var(--surface);
            padding: 32px;
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        h1 {
            color: #FFFFFF;
            font-size: 1.8rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-tag {
            background-color: var(--primary);
            color: #000000;
            padding: 4px 10px;
            font-size: 0.78rem;
            font-weight: 800;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .lang-select {
            background-color: #121212;
            color: var(--text);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }
        .routine-header {
            margin-bottom: 24px;
        }
        .routine-title {
            font-size: 2rem;
            font-weight: 800;
            color: #FFFFFF;
            margin: 0 0 10px 0;
        }
        .routine-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .meta-pill {
            background: #121212;
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .meta-pill.highlight {
            border-color: var(--primary);
            color: var(--primary);
            font-weight: bold;
        }
        .action-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 28px 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
            border: none;
            text-align: center;
        }
        .btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .btn-primary {
            background: var(--primary);
            color: #000000;
            flex: 1 1 240px;
        }
        .btn-secondary {
            background: #141414;
            color: var(--text);
            border: 1px solid var(--border);
            flex: 1 1 200px;
        }
        .btn-secondary:hover {
            border-color: var(--primary);
        }
        .section-title {
            font-size: 1.25rem;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-top: 32px;
            margin-bottom: 16px;
        }
        .exercises-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .exercise-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
        }
        .exercise-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .exercise-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #FFFFFF;
            margin: 0;
        }
        .rest-badge {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: #181818;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .sets-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }
        .sets-table th {
            text-align: left;
            color: var(--text-secondary);
            font-size: 0.78rem;
            text-transform: uppercase;
            padding-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .sets-table td {
            padding: 6px 0;
            border-top: 1px solid #333333;
        }
        .badge-type {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-inline-start: 8px;
        }
        .badge-warmup {
            background: rgba(255, 183, 77, 0.2);
            color: var(--warmup);
        }
        .badge-dropset {
            background: rgba(186, 104, 200, 0.2);
            color: var(--dropset);
        }
        .badge-failure {
            background: rgba(229, 115, 115, 0.2);
            color: var(--failure);
        }
        .info-card {
            background: rgba(212, 175, 55, 0.08);
            border-inline-start: 4px solid var(--primary);
            padding: 16px;
            border-radius: 6px;
            margin: 20px 0;
        }
        .error-card {
            background: rgba(207, 102, 121, 0.12);
            border-inline-start: 4px solid #CF6679;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }
            .routine-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

                error_desc: "リンクが無効か破損しています。"
            },
            ko: {
                badge: "루틴",
                import_btn: "Barbell Buddy 로 가져오기",
                store_btn: "Google Play 에서 다운로드",
                exercises_heading: "운동 종목",
                sets: "세트",
                reps: "회",
                rest: "휴식",
                sec: "초",
                warmup: "웜업",
                dropset: "드롭세트",
                failure: "실패지점",
                empty_title: "루틴 정보를 찾을 수 없습니다",
                empty_desc: "이 링크에는 루틴 데이터가 포함되어 있지 않습니다.",
                error_title: "루틴 불러오기 실패",
                error_desc: "링크가 올바르지 않거나 손상되었습니다."
            },
            zh: {
                badge: "训练计划",
                import_btn: "导入至 Barbell Buddy",
                store_btn: "在 Google Play 下载",
                exercises_heading: "训练动作",
                sets: "组",
                reps: "次",
                rest: "组间休息",
                sec: "秒",
                warmup: "热身组",
                dropset: "递减组",
                failure: "力竭组",
                empty_title: "未找到训练计划数据",
                empty_desc: "此链接不包含有效的训练计划数据。",
                error_title: "加载失败",
                error_desc: "该训练计划链接无效或已损坏。"
            }
        };

        let currentRoutine = null;
        let currentHash = "";

        function resolveInitialLang() {
            const params = new URLSearchParams(window.location.search);
            const queryLang = (params.get("lang") || "").toLowerCase().split("-")[0];
            if (queryLang === "in") return "id";
            if (i18n[queryLang]) return queryLang;

            const browserLangs = navigator.languages || [navigator.language || "en"];
            for (const raw of browserLangs) {
                const code = (raw || "").toLowerCase().split("-")[0];
                const normalized = code === "in" ? "id" : code;
                if (i18n[normalized]) return normalized;
            }
            return "en";
        }

        function base64UrlToBytes(base64Url) {
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4 !== 0) {
                base64 += '=';
            }
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        async function decompressGzip(bytes) {
            if (typeof DecompressionStream === 'undefined') {
                throw new Error("DecompressionStream is not supported by your browser");
            }
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            writer.write(bytes);
            writer.close();
            const res = new Response(ds.readable);
            const buffer = await res.arrayBuffer();
            return new TextDecoder().decode(buffer);
        }

        function renderLang(lang) {
            const data = i18n[lang] || i18n.en;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
            document.title = currentRoutine ? `${currentRoutine.n} - Barbell Buddy` : `Barbell Buddy - ${data.badge}`;

            document.getElementById("t-badge").textContent = data.badge;
            document.getElementById("t-import-btn").textContent = data.import_btn;
            document.getElementById("t-store-btn").textContent = data.store_btn;
            document.getElementById("t-store-btn-err").textContent = data.store_btn;
            document.getElementById("t-exercises-heading").textContent = data.exercises_heading;
            document.getElementById("lang-switcher").value = lang;

            if (currentRoutine) {
                renderRoutineDetails(currentRoutine, data);
            }
        }

        function renderRoutineDetails(routine, data) {
            document.getElementById("routine-name").textContent = routine.n || "Routine";

            const metaDay = document.getElementById("meta-day");
            if (routine.d) {
                metaDay.textContent = routine.d;
                metaDay.style.display = "inline-block";
            } else {
                metaDay.style.display = "none";
            }

            const exCount = routine.e ? routine.e.length : 0;
            let totalSets = 0;
            if (routine.e) {
                routine.e.forEach(ex => {
                    totalSets += (ex.s ? ex.s.length : 0);
                });
            }

            document.getElementById("meta-exercises-count").textContent = `${exCount} ${data.exercises_heading}`;
            document.getElementById("meta-sets-count").textContent = `${totalSets} ${data.sets}`;

            // Build exercises container
            const container = document.getElementById("exercises-container");
            container.innerHTML = "";

            if (!routine.e || routine.e.length === 0) {
                return;
            }

            routine.e.forEach((ex, idx) => {
                const card = document.createElement("div");
                card.className = "exercise-card";

                const head = document.createElement("div");
                head.className = "exercise-head";

                const name = document.createElement("h4");
                name.className = "exercise-name";
                name.textContent = `${idx + 1}. ${ex.n}`;

                const rest = document.createElement("span");
                rest.className = "rest-badge";
                rest.textContent = `⏱️ ${ex.r || 60}${data.sec} ${data.rest.toLowerCase()}`;

                head.appendChild(name);
                head.appendChild(rest);
                card.appendChild(head);

                if (ex.s && ex.s.length > 0) {
                    const table = document.createElement("table");
                    table.className = "sets-table";
                    table.innerHTML = `
                        <thead>
                            <tr>
                                <th style="width: 25%;">${data.sets}</th>
                                <th style="width: 45%;">${data.reps}</th>
                                <th style="width: 30%; text-align: right;">Weight</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${ex.s.map((set, sIdx) => {
                                let typeBadge = "";
                                if (set.t === "WARMUP") typeBadge = `<span class="badge-type badge-warmup">${data.warmup}</span>`;
                                else if (set.t === "DROPSET") typeBadge = `<span class="badge-type badge-dropset">${data.dropset}</span>`;
                                else if (set.t === "FAILURE") typeBadge = `<span class="badge-type badge-failure">${data.failure}</span>`;

                                const weightText = set.w > 0 ? `${set.w} kg` : "BW";
                                return `
                                    <tr>
                                        <td>#${sIdx + 1} ${typeBadge}</td>
                                        <td>${set.r} ${data.reps}</td>
                                        <td style="text-align: right; font-weight: bold; color: var(--primary);">${weightText}</td>
                                    </tr>
                                `;
                            }).join("")}
                        </tbody>
                    `;
                    card.appendChild(table);
                }

                container.appendChild(card);
            });
        }

        async function loadRoutineFromHash() {
            const rawHash = (window.location.hash || "").replace(/^#/, "").trim();
            currentHash = rawHash;

            const loadingEl = document.getElementById("loading-state");
            const errorEl = document.getElementById("error-state");
            const contentEl = document.getElementById("content-state");

            if (!rawHash) {
                loadingEl.style.display = "none";
                errorEl.style.display = "block";
                contentEl.style.display = "none";
                const lang = resolveInitialLang();
                const data = i18n[lang] || i18n.en;
                document.getElementById("t-error-title").textContent = data.empty_title;
                document.getElementById("t-error-desc").textContent = data.empty_desc;
                return;
            }

            try {
                const compressedBytes = base64UrlToBytes(rawHash);
                const jsonText = await decompressGzip(compressedBytes);
                currentRoutine = JSON.parse(jsonText);

                // Configure Intent button URI
                const intentUrl = `intent://import_routine?data=${encodeURIComponent(rawHash)}#Intent;scheme=barbellbuddy;package=com.xavisprojects.barbellbible;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.xavisprojects.barbellbible%26utm_source%3Dshare_routine;end`;
                document.getElementById("btn-import-intent").href = intentUrl;

                loadingEl.style.display = "none";
                errorEl.style.display = "none";
                contentEl.style.display = "block";

                renderLang(resolveInitialLang());
            } catch (err) {
                console.error("Failed to decode routine payload:", err);
                loadingEl.style.display = "none";
                errorEl.style.display = "block";
                contentEl.style.display = "none";
                const lang = resolveInitialLang();
                const data = i18n[lang] || i18n.en;
                document.getElementById("t-error-title").textContent = data.error_title;
                document.getElementById("t-error-desc").textContent = data.error_desc;
            }
        }

        const switcher = document.getElementById("lang-switcher");
        switcher.addEventListener("change", (e) => {
            const newLang = e.target.value;
            renderLang(newLang);
            const url = new URL(window.location);
            url.searchParams.set("lang", newLang);
            window.history.replaceState({}, "", url);
        });

        window.addEventListener("hashchange", loadRoutineFromHash);

        loadRoutineFromHash();
    </script>
</body>
